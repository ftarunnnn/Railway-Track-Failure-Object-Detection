project_name: "Railway Track Failure & Object Detection"
version: "1.0.0"

paths:
  raw_sensor_data: "data/raw/sensor_data.csv"
  processed_sensor_data: "data/processed/cleaned_sensor_data.csv"
  features_data: "data/processed/features_engineered.csv"
  raw_images_dir: "data/raw/images"
  processed_images_dir: "data/processed/images"
  models_dir: "models/saved_models"
  reports_dir: "reports"
  figures_dir: "reports/figures"

sensor_data:
  num_samples: 2000
  failure_ratio: 0.25
  random_seed: 42

image_data:
  num_images: 100
  image_size: [640, 640]
  classes:
    0: "normal"
    1: "broken_rail"
    2: "crack"
    3: "missing_fishplate"
    4: "obstacle"

ml_model:
  target_col: "failure_status"
  test_size: 0.2
  n_estimators: 100
  max_depth: 6
  random_state: 42

dl_model:
  input_shape: [3, 640, 640]
  batch_size: 16
  epochs: 10
  lr: 0.001

api:
  host: "0.0.0.0"
  port: 8000
